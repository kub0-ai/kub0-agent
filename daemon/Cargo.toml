[package]
name = "vallumd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "kub0d: the per-app connection monitor and exec gate behind kub0 and its Omarchy panel"

[lib]
name = "vallumd"
path = "src/lib.rs"

[[bin]]
name = "kub0d"
path = "src/main.rs"

[dependencies]
libc = "0.2"
maxminddb = "0.32"
# maxminddb::Reader::within takes an ipnetwork::IpNetwork; the version maxminddb 0.32 pins.
ipnetwork = "0.21"
# `bundled` compiles SQLite from source rather than linking the host's. It costs
# one slow first build and buys two things worth more: the musl release
# artifacts have no runtime dependency to go missing, and the version reading
# someone else's live database is one we pinned rather than whatever the distro
# shipped.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Minimal blocking HTTP client for the kub0 device flow and heartbeat. rustls
# rather than native-tls so the musl release artifacts keep working with no
# system OpenSSL, and `gzip`/`cookies` stay off: this client talks to two JSON
# endpoints and needs neither.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
sha2 = "0.10"
