[workspace]
resolver = "2"
members = ["daemon", "helper", "cli"]

[workspace.package]
# Upstream shipped 1.0.0. vallum is a prototype and inherited that number
# without earning it, so the version resets rather than claiming a stability
# promise nothing here can keep yet.
version = "0.5.2"
edition = "2021"
license = "MIT"
# Cargo's `authors` cannot express "forked from", and leaving it as upstream's
# sole author would credit him with code he has never seen. THIRD-PARTY.md is
# the authoritative provenance record; this field just points at it.
authors = ["kub0-ai"]
