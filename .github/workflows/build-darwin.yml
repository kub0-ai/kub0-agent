name: build-darwin
# Two macOS jobs, on every pull request as well as on main, on release tags
# and by hand. They were kept off pull requests while this repository was
# private, where macOS runners bill at ten times the Linux rate, and a test
# that did not compile on macOS reached main without one run to say so.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo build --locked -p vallumd
      - run: cargo test --locked -p vallumd --lib
      - run: cargo test --locked -p vallumd --bin kub0d source_defaults_and_explicit_overrides
      - name: Independent Apple SDK ABI and private live libproc gate
        run: python3 tests/darwin-native-gate.py
