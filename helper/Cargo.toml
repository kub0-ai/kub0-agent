[package]
name = "vallum-block"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "kub0-block: the privileged nftables/cgroup helper kub0d runs."

[lib]
name = "vallum_block"
path = "src/lib.rs"

[[bin]]
name = "kub0-block"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
